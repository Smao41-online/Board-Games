name: Deploy to GitHub Pages

# Publishes the repo content to the gh-pages branch. GitHub Pages serves that
# branch (Settings -> Pages -> Source: Deploy from a branch -> gh-pages).
# This avoids the Pages REST API entirely, which workflow tokens may not call.

on:
  push:
    branches: [claude/board-game-database-solar-9avghh, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -r --cached .github >/dev/null 2>&1 || true
          rm -rf .github
          git add -A
          git commit -m "Deploy site from $GITHUB_SHA"
          git push -f origin gh-pages
