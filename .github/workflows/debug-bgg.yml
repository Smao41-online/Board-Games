name: Debug BGG access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BGG endpoints
        run: |
          probe() {
            echo "=== $1"
            curl -sS -m 20 -D - -o /tmp/body "$1" -H "User-Agent: $2" || echo "CURL FAILED"
            echo "--- body (first 500) ---"
            head -c 500 /tmp/body; echo; echo
          }
          probe "https://api.geekdo.com/api/geeksearch?q=ark%20nova&objecttype=thing" "Mozilla/5.0"
          probe "https://api.geekdo.com/api/search?q=ark%20nova&objecttype=thing" "Mozilla/5.0"
          probe "https://api.geekdo.com/api/searchsuggestions?q=ark%20nova" "Mozilla/5.0"
          probe "https://api.geekdo.com/api/geeksearch?query=ark%20nova&objecttype=thing&showcount=10" "Mozilla/5.0"
          probe "https://api.geekdo.com/api/typeahead?q=ark%20nova" "Mozilla/5.0"
          echo "=== dynamicinfo full body"
          curl -sS -m 20 "https://api.geekdo.com/api/dynamicinfo?objectid=342942&objecttype=thing" -H "User-Agent: Mozilla/5.0" | jq -c '.item | keys' || true
          curl -sS -m 20 "https://api.geekdo.com/api/dynamicinfo?objectid=342942&objecttype=thing" -H "User-Agent: Mozilla/5.0" | jq -c '{rank: .item.rankinfo[0], stats: .item.stats}' || true
